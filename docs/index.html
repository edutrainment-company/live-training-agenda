      :root {
        --orange: #ef790c;
        --cream: #ffffff;
        --ink: #515869;
        --muted: #707784;
        --line: #eeeeee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050505;
        color: var(--ink);
        font-family:
          Open Sans,
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      main {
        min-height: 100vh;
        padding: 26px;
        position: relative;
        overflow: hidden;
      }
      .video-background {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: -3;
        background: #050505;
      }
      .video-background video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1.1) contrast(1.05);
      }
      .video-overlay {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: -2;
        background:
          linear-gradient(180deg, #000000ad, #000000e6),
          radial-gradient(circle at center, #ef790c1a, #00000094);
      }
      .ambient {
        display: none;
      }
      .shell {
        max-width: 1160px;
        margin: auto;
        position: relative;
        z-index: 1;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0 32px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #fff;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--orange);
        color: #fff;
        font-size: 12px;
        letter-spacing: 0;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hats-mark {
        width: 48px;
        height: 30px;
        object-fit: contain;
      }
      .video-upload {
        height: 38px;
        padding: 4px 8px;
        border: 1px dashed rgba(255, 255, 255, 0.42);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #fff;
        cursor: pointer;
        background: #0007;
        overflow: hidden;
        font-size: 15px;
      }
      .video-upload input {
        display: none;
      }
      .video-upload span {
        font-size: 10px;
        font-weight: 700;
      }
      .logo-upload {
        height: 38px;
        max-width: 140px;
        min-width: 88px;
        padding: 4px 8px;
        border: 1px dashed rgba(255, 255, 255, 0.42);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #fff;
        cursor: pointer;
        background: #0007;
        overflow: hidden;
      }
      .logo-upload input {
        display: none;
      }
      .logo-upload span {
        color: var(--orange);
        font-size: 19px;
      }
      .logo-upload small {
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
      }
      .logo-upload.has-logo {
        border-style: solid;
        border-color: #ffffff5c;
        padding: 4px 7px;
        background: #fff;
      }
      .logo-upload img {
        max-width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .clock {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: #0008;
        border-radius: 4px;
        padding: 9px 12px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      .clock small {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #ddd;
        font-weight: 600;
      }
      .pulse {
        width: 7px;
        height: 7px;
        background: var(--orange);
        border-radius: 50%;
        box-shadow: 0 0 0 4px #ef790c33;
      }
      .language {
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: 4px;
        background: #0008;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .language button {
        border: 0;
        background: transparent;
        border-radius: 2px;
        padding: 7px 9px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .language button.selected {
        background: #fff;
        color: #515869;
        box-shadow: 0 1px 4px #00000012;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 36px 0 30px;
        border-top: 1px solid rgba(239, 121, 12, 0.4);
      }
      .eyebrow {
        color: var(--orange);
        font-size: 12px;
        letter-spacing: 0.16em;
        font-weight: 800;
        margin: 0 0 8px;
      }
      .event-title {
        position: relative;
        display: block;
      }
      .event-title span {
        position: absolute;
        right: 2px;
        top: -13px;
        color: #ddd;
        font-size: 10px;
        opacity: 0;
        transition: 0.15s;
      }
      .event-title:focus-within span,
      .event-title:hover span {
        opacity: 1;
      }
      .event-title input {
        width: min(690px, 78vw);
        padding: 0 4px 2px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #fff;
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 0.95;
        outline: 0;
      }
      .event-title input:hover {
        border-color: #d8dadd;
      }
      .event-title input:focus {
        border-color: var(--orange);
      }
      .subtitle {
        margin: 16px 0 0;
        color: #e3e3e3;
        font-size: 15px;
      }
      .timer-card {
        min-width: 225px;
        padding: 17px 20px;
        border: 1px solid rgba(239, 121, 12, 0.46);
        border-radius: 0;
        background: #000a;
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #fff;
      }
      .timer-card span {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: #ddd;
        letter-spacing: 0.08em;
      }
      .timer-card strong {
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      .timer-card small {
        color: #ddd;
        font-size: 11px;
        line-height: 1.35;
      }
      .command-bar {
        background: #000;
        color: #fff;
        border-radius: 0;
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .start-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .start-group label {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #eee;
        font-size: 12px;
      }
      .start-group input {
        border: 1px solid #6d6d6d;
        border-radius: 2px;
        padding: 7px;
        background: #202020;
        color: #fff;
        color-scheme: dark;
      }
      .primary,
      .secondary {
        border: 0;
        border-radius: 2px;
        padding: 10px 14px;
        font-weight: 700;
        font-size: 13px;
      }
      .primary {
        background: var(--orange);
        color: #fff;
      }
      .primary span {
        font-size: 10px;
        margin-right: 7px;
      }
      .secondary {
        background: #515869;
        color: #fff;
      }
      .status {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      .divider {
        width: 1px;
        height: 18px;
        background: #707070;
      }
      .link-section {
        margin-top: 15px;
        border: 1px solid rgba(239, 121, 12, 0.4);
        background: #000000b3;
        border-radius: 0;
        overflow: hidden;
        color: #fff;
      }
      .link-toggle {
        width: 100%;
        border: 0;
        background: transparent;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 17px;
        text-align: left;
      }
      .qr-icon {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        background: #ef790c22;
        color: var(--orange);
        border-radius: 0;
        font-size: 18px;
      }
      .link-toggle span:nth-child(2) {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .link-toggle strong {
        font-size: 13px;
      }
      .link-toggle small {
